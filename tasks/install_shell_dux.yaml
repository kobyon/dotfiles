---
- name: Notice - dux-shell is only available on CachyOS
  ansible.builtin.debug:
    msg: >-
      dux-shell installation is currently only supported on CachyOS
      (dms-shell comes from the CachyOS repos). Other distros are not supported yet.

- name: Install dux-shell packages
  community.general.pacman:
    name: "{{ dux_shell_packages }}"
    state: present
  become: true

# pacman doesn't enable user services. Without this nothing starts DMS:
# no bar, no wallpaper (niri's gray background). Starts with the next niri session.
- name: Enable the DMS user service
  ansible.builtin.systemd_service:
    name: dms.service
    scope: user
    enabled: true
