---
- name: Check the desktop_shell value
  ansible.builtin.assert:
    that: desktop_shell in ['dux-shell', 'noctalia']
    fail_msg: "desktop_shell must be dux-shell or noctalia, got '{{ desktop_shell }}'"
    quiet: true

- name: Install dux-shell
  ansible.builtin.include_tasks: install_shell_dux.yaml
  when: desktop_shell == 'dux-shell'
